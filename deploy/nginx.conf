# Nginx config for Re Jobs — VPS deployment
# Place in: /etc/nginx/sites-available/rejobs
# Then: sudo ln -s /etc/nginx/sites-available/rejobs /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Limit upload size (resumes max 5 MB + form overhead)
    client_max_body_size 10M;

    # Static files served directly by nginx
    location /static/ {
        alias /home/rejobs/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (uploaded resumes) — served directly
    location /media/ {
        alias /home/rejobs/app/media/;
        expires 7d;
        # Prevent execution of uploaded files
        add_header Content-Disposition "attachment";
    }

    # Pass everything else to gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }
}
