{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{% if editing %}Edit Job Listing{% else %}Post a Job{% endif %}{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex align-items-center mb-4 mt-2">
        <a href="{% url 'dashboard:employer' %}" class="text-muted me-3"><i class="bi bi-arrow-left"></i></a>
        <h1 class="h4 fw-bold mb-0">{% if editing %}Edit Job Listing{% else %}Post a Job{% endif %}</h1>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form method="post" novalidate>
            {% csrf_token %}
            {% crispy form %}
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
