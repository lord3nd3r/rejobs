{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Company Profile{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 mt-4">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-1">Company Profile</h1>
          <p class="text-muted mb-4">Tell job seekers about your company.</p>
          <form method="post" novalidate>
            {% csrf_token %}
            {% crispy form %}
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
